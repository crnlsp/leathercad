name: CodeQL

# Static analysis of the TypeScript. Code scanning on a private repository
# needs GitHub Advanced Security, so the job skips itself until the repository
# is public; the workflow is here so going public turns it on.

on:
  push:
    # develop is where development lands; main gets only what develop tested.
    branches: [develop]
  # Analyses TypeScript and JavaScript, so a change to documentation alone has
  # nothing for it to read. Not a required check, so a run skipped here never
  # leaves a pull request waiting for it.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'packaging/aur/**']
  schedule:
    - cron: '41 5 * * 3'

# A newer push makes the older analysis moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
