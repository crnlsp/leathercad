# Investigation branch only: this probe is restored to the original workflow
# before a fix PR is prepared. It does not replace any production CI gate.
name: PDF export diagnostic probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Cold PDF export profile (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Same toolchain and display as the nightly that found #195.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: brew install poppler
      - run: swift tools/ci/full-hd-display.swift
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Fresh app per sample, no retries, with the original 200 ms assertion.
      - name: Ten cold exports, with main-thread and worker phase evidence
        run: pnpm exec playwright test e2e/pdf-worker.spec.ts --grep 'keeps painting' --repeat-each 10 --retries 0 --reporter=list,html
      # Keep evidence even for an intermittent pass, not just failed attempts.
      - name: Upload profile and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-export-profile-macos
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
