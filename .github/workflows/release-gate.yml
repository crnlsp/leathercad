name: Release gate

# main is what is released, and a release is a whole section of the roadmap:
# everything under "the next release" in docs/roadmap.md, all of it done
# (CONTRIBUTING.md, "Changelog and releases"). So a pull request into main
# comes from develop with nothing in that section still marked planned or in
# progress, or it is release-please's own release pull request. Required by
# the ruleset on main (roadmap R2, R7).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions: {}

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: From develop, with the next release done
        env:
          # Through the environment, never interpolated into the script.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: tools/release-gate.sh
