name: Release

# release-please keeps one pull request open that bumps the version and writes
# CHANGELOG.md from the conventional commits merged since the last release.
# Merging that pull request tags the release. The build job then makes each
# platform's installer from the tag — the AppImage and the Flatpak, the
# Windows NSIS installer and the macOS dmg (8.6a) — and the publish job attests
# them and attaches them, with an SBOM, to the release.
#
# The build runs every build-time dependency and the Flatpak bundler, so it
# holds a read-only token and nothing it could publish or sign with. Only the
# publish job can write to the release or sign provenance, and it checks out
# nothing and installs nothing: what it runs is GitHub's own actions and `gh`.
# The installers cross between the two as artifacts, whose digests the
# download checks.
#
# Unsigned on Windows and ad-hoc signed on macOS, by decision: the project
# does not buy signing certificates (roadmap 8.6, Code signing). Each
# installer carries build provenance instead. electron-builder would sign if
# CSC_LINK were ever set.
#
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings →
# Actions → General). A pull request opened with the workflow token does not
# trigger CI on itself; see ADR 0014.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer
        run: pnpm package

      # The Flatpak beside the AppImage (8.5). Its runtimes come from Flathub,
      # installed for this user by the bundler.
      - name: Flatpak
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder &&
          flatpak remote-add --user --if-not-exists flathub
          https://dl.flathub.org/repo/flathub.flatpakrepo &&
          pnpm package:flatpak

      # A build SBOM: everything that went into the installers, build tooling
      # included. The app ships no node_modules — Vite bundles its runtime
      # code — so a production-only SBOM would be empty. One is enough: the
      # dependency tree is the same on every platform.
      - name: SBOM
        if: runner.os == 'Linux'
        run: >-
          pnpm sbom --sbom-format cyclonedx --sbom-type application
          --filter @leathercad/desktop --out apps/desktop/release/leathercad.cdx.json

      # Handed to the publish job, which needs every platform's before it
      # attaches any: a release is all its installers or none.
      - name: Keep the installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.flatpak
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.cdx.json
          if-no-files-found: error
          retention-days: 7
          # Installers are compressed already.
          compression-level: 0

  publish:
    name: Attest and attach
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # Signed provenance: these files were built by this workflow from this
      # commit. Attestations on a private repository need Enterprise Cloud,
      # so the step skips itself if the repository is ever private again.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.AppImage
            release/*.flatpak
            release/*.exe
            release/*.dmg

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
