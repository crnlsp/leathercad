name: Release

# release-please keeps one pull request open that bumps the version and writes
# CHANGELOG.md from the conventional commits merged since the last release.
# Merging that pull request tags the release. The build job then smoke-tests
# and makes each platform's installer from the tag, through installers.yml —
# the AppImage and the Flatpak, the Windows NSIS installer and the macOS dmg
# (8.6a) — and the publish job attests them and attaches them, with an SBOM,
# to the release.
#
# The build runs every build-time dependency and the Flatpak bundler, so it
# holds a read-only token and nothing it could publish or sign with. Only the
# publish job can write to the release or sign provenance, and it checks out
# nothing and installs nothing: what it runs is GitHub's own actions and `gh`.
# The installers cross between the two as artifacts, whose digests the
# download checks.
#
# Unsigned on Windows and ad-hoc signed on macOS, by decision: the project
# does not buy signing certificates (roadmap 8.6, Code signing). Each
# installer carries build provenance instead. electron-builder would sign if
# CSC_LINK were ever set.
#
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings →
# Actions → General). A pull request opened with the workflow token does not
# trigger CI on itself; see ADR 0014.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # installers.yml smoke-tests each platform's build, then makes the files
  # this release attaches, from the tag. A job that calls a workflow takes no
  # timeout of its own; each of its jobs has one. `./` rather than `$/`, as in
  # package.yml.
  build:
    name: Build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/installers.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  publish:
    name: Attest and attach
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Every platform's, or the job never starts: a release is all its
      # installers or none.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      # Signed provenance: these files were built by this workflow from this
      # commit. Attestations on a private repository need Enterprise Cloud,
      # so the step skips itself if the repository is ever private again.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.AppImage
            release/*.flatpak
            release/*.exe
            release/*.dmg

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
