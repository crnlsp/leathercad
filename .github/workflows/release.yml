name: Release

# release-please keeps one pull request open that bumps the version and writes
# CHANGELOG.md from the conventional commits merged since the last release.
# Merging that pull request tags the release. The build job then smoke-tests
# and makes each platform's installer from the tag, through installers.yml —
# the AppImage, the Flatpak and the .deb, the Windows NSIS installer and the
# macOS dmg (8.6a) — and the publish job attests the ones that built and
# attaches them, with an SBOM, to the release. A platform that did not build
# does not hold the others back, except Linux, the one every level promises:
# a release goes out without Windows or macOS and says so in its notes, and
# without Linux it goes out with no files at all (docs/release-checklist.md, *What a failure
# holds, by level*).
#
# The build runs every build-time dependency and the Flatpak bundler, so it
# holds a read-only token and nothing it could publish or sign with. Only the
# publish job can write to the release or sign provenance, and it checks out
# nothing and installs nothing: what it runs is GitHub's own actions, `gh` and
# `jq`. The installers cross between the two as artifacts, whose digests the
# download checks.
#
# Unsigned on Windows and ad-hoc signed on macOS, by decision: the project
# does not buy signing certificates (roadmap 8.6, Code signing). Each
# installer carries build provenance instead. electron-builder would sign if
# CSC_LINK were ever set.
#
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings →
# Actions → General). A pull request opened with the workflow token does not
# trigger CI on itself; see ADR 0014.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # installers.yml smoke-tests each platform's build, then makes the files
  # this release attaches, from the tag. A job that calls a workflow takes no
  # timeout of its own; each of its jobs has one. `./` rather than `$/`, as in
  # ci.yml.
  build:
    name: Build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/installers.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  # Attests and attaches what built. The build job reaches this one only as a
  # single result, `needs.build.result`, however many of its legs failed, so
  # which platforms built is read from the files that came across.
  publish:
    name: Attest and attach
    needs: [release-please, build]
    # Not `always()`, which also runs after somebody cancels the run: a failed
    # build is the case this job is for, a cancelled run publishes nothing.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Read for the notes: the failed job's link and the open `known-issue`
      # issues. A rehearsal on a runner showed a public repository serves both
      # with no permissions at all; these keep the reads working if it is ever
      # private again, as the attestation below is conditioned on.
      actions: read
      issues: read
    steps:
      # The installers that exist, flat in release/. A platform that failed
      # uploaded nothing, and a pattern that matches nothing is not an error,
      # so a missing platform is simply not here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      # Which platforms built, and for each that did not, the job that failed.
      # Linux ships the AppImage, the Flatpak and the .deb from one job, so it
      # is missing unless all three are here. The platform names are
      # installers.yml's `runner.os`, and the job names end in its matrix `os`.
      # The notes go to a file for the steps below; a platform whose job cannot
      # be found links the run, which lists them all.
      #
      # `shell: bash` is `pipefail`: without it a failed `gh api` would pass
      # for an empty list. The jobs and the issues are only for the notes, so
      # failing to read them warns and never stops the files.
      - name: What built
        id: built
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=()
          has() { compgen -G "release/$1" > /dev/null; }
          { has '*.AppImage' && has '*.flatpak' && has '*.deb'; } || missing+=(Linux)
          has '*.exe' || missing+=(Windows)
          has '*.dmg' || missing+=(macOS)
          echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jobs='[]'
          if [ "${#missing[@]}" -gt 0 ]; then
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq '.jobs[] | {name, conclusion, html_url}' | jq -s .) || {
              echo "::warning title=Failed jobs::The run's jobs could not be listed; the notes link the run instead."
              jobs='[]'
            }
          fi

          # An issue title is anyone's text, so it cannot open a tag, a link or the
          # marker the next step looks for.
          known=$(gh issue list --repo "$GITHUB_REPOSITORY" --label known-issue --state open \
            --limit 100 --json number,title,url \
            --jq '.[] | "- [#\(.number)](\(.url)) \(.title | gsub("[<>\\[\\]\\r\\n]"; " "))"') || {
            echo "::warning title=Known issues::The open known-issue issues could not be listed; the notes leave them out."
            known=''
          }

          {
            if [ "${#missing[@]}" -gt 0 ]; then
              echo '### Missing in this release'
              echo
              for platform in "${missing[@]}"; do
                case $platform in
                  Linux) leg=ubuntu-latest what='The AppImage, the Flatpak and the .deb' ;;
                  Windows) leg=windows-latest what='The Windows installer' ;;
                  macOS) leg=macos-latest what='The macOS dmg' ;;
                esac
                url=$(jq -r --arg leg "($leg)" 'first(.[]
                  | select(.name | endswith($leg))
                  | select(.conclusion | IN("failure", "cancelled", "timed_out"))
                  | .html_url) // empty' <<< "$jobs")
                echo "- **$platform:** $what did not build ([the failed job](${url:-$run_url}))."
              done
              if [[ " ${missing[*]} " == *' Linux '* ]]; then
                echo
                echo 'Nothing is attached to this release.'
              fi
            fi
            if [ -n "$known" ]; then
              [ "${#missing[@]}" -gt 0 ] && echo
              echo '### Known issues'
              echo
              echo "$known"
            fi
          } > "$RUNNER_TEMP/notes.md"

      # Level 1: Linux is promised everywhere. This is before the attestation
      # and the upload, so a release without Linux has no files at all, and the
      # notes below still say why.
      - name: Stop without Linux
        if: ${{ contains(steps.built.outputs.missing, 'Linux') }}
        run: |
          echo "::error title=Linux::The Linux installers did not build, so nothing is attached to this release."
          exit 1

      # Signed provenance: these files were built by this workflow from this
      # commit. Attestations on a private repository need Enterprise Cloud,
      # so the step skips itself if the repository is ever private again. A
      # pattern with no file, a platform that did not build, adds nothing.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.AppImage
            release/*.flatpak
            release/*.deb
            release/*.exe
            release/*.dmg

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*

      # The notes are release-please's, written once when it tagged the release;
      # it never rewrites them, so what this adds stays. It adds one block
      # between two markers and takes the previous one out first, so
      # *Re-run failed jobs* after a repaired build leaves the notes saying what
      # is true then, not twice. Last, and even after a failure above, so the
      # notes still say why a release has no files; a failure here costs the
      # notes and never the files.
      - name: Release notes
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          notes=$(awk '/<!-- leathercad-release:start -->/ { skip = 1 } !skip { print } /<!-- leathercad-release:end -->/ { skip = 0 }' <<< "$body")
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes+=$'\n\n<!-- leathercad-release:start -->\n'"$(cat "$RUNNER_TEMP/notes.md")"$'\n<!-- leathercad-release:end -->'
          fi
          if [ "$notes" != "$body" ]; then
            printf '%s\n' "$notes" | gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file -
          fi
