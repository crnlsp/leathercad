name: Package

# Every installer, smoke-tested and built on Linux, Windows and macOS by
# installers.yml — the same workflow the release builds with, from its tag.
#
# On every pull request and every push to main and develop (roadmap R5). This
# was written while the repository was private, where a macOS minute costs ten
# and a Windows minute two, so it ran only when packaging could have changed,
# and weekly to catch the rest. A public repository's minutes are free, and a
# change anywhere can break a package, so now every change runs it.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Its checks are named `Installers / Build (<os>)`, as a called workflow's
  # jobs are. `./`, not the `$/` zizmor asks for, which actionlint cannot
  # parse yet (rhysd/actionlint#711); for a called workflow the two mean the
  # same: GitHub reads it from the caller's own commit, not from a checkout.
  installers:
    name: Installers
    uses: ./.github/workflows/installers.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ github.sha }}

  # The develop and main rulesets require the four checks these builds were
  # called before they moved into installers.yml. Until the rulesets name
  # their replacement (plan 2026-10-31-ci-cd-and-shipping, Task A2, which
  # deletes this job), each name is reported here, and passes only when every
  # build did. `always()`, because a required check that is skipped counts as
  # passed.
  required:
    name: ${{ matrix.check }}
    needs: installers
    if: always()
    strategy:
      matrix:
        check: [Package, Package (windows-latest), Package (macos-latest), Flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every installer built
        env:
          RESULT: ${{ needs.installers.result }}
        run: |
          echo "Installers: $RESULT"
          test "$RESULT" = success
