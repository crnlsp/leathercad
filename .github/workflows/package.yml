name: Package

# Windows and macOS builds (slice 8.6a): the packaged smoke test on each, then
# the installer a user would download; and the Flatpak (8.5). Linux's AppImage
# is packaged by ci.yml.
#
# On every pull request and every push to main and develop (roadmap R5). This
# was written while the repository was private, where a macOS minute costs ten
# and a Windows minute two, so it ran only when packaging could have changed,
# and weekly to catch the rest. A public repository's minutes are free, and a
# change anywhere can break a package, so now every change runs it. The release
# workflow builds all three platforms again, from the tag.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The smoke test reads the exported PDF with poppler, independently of
      # the writer that made it.
      - name: Install poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler

      # The community feed fails now and then. On 2026-10-07 it answered 504,
      # choco reported "installed 0/0 packages" and succeeded, and the smoke
      # test failed later, as `pdfinfo` ENOENT. So: three tries, and if poppler
      # is still missing, fail here, saying so.
      - name: Install poppler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            choco install poppler --no-progress -y && command -v pdfinfo && exit 0
            echo "poppler is not installed after attempt $attempt."
            sleep $((attempt * 20))
          done
          echo "::error title=poppler::Not installed after three attempts. The packaged smoke test needs its pdfinfo."
          exit 1

      - run: pnpm install --frozen-lockfile

      # The packaged app, driven by Playwright: asar with its integrity check,
      # the fuses, the ad-hoc signature on macOS.
      - name: Packaged smoke test
        run: pnpm test:packaged

      # Then the installer a user would download, with every fuse as shipped.
      - name: Installer
        run: pnpm package

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-report-${{ runner.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The Flatpak (slice 8.5), built from Electron's base app on the Freedesktop
  # runtime, both installed from Flathub by the bundler. Linux's other build,
  # the AppImage, is packaged by ci.yml.
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      # The bundler installs the runtime, the SDK and the base app for this
      # user, from whichever remote the user has: Flathub.
      - name: Add Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - run: pnpm install --frozen-lockfile

      - name: Flatpak
        run: pnpm package:flatpak

      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: apps/desktop/release/*.flatpak
          retention-days: 7
          if-no-files-found: error
