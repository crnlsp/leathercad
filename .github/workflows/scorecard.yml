name: Scorecard

# OpenSSF Scorecard: a public score for the repository's security hygiene —
# pinned dependencies, branch protection, token permissions, and more. It
# needs a public repository, so it skips itself until there is one.

on:
  push:
    branches: [main]
  schedule:
    - cron: '53 5 * * 4'
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Publishing the result to the OpenSSF API signs it with this token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard.sarif
