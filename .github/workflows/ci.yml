name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # poppler renders the exported PDF so the tests can measure it in
      # pixels — the closest thing to checking the print with a steel rule.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Layering
        run: pnpm depcruise

      - name: Test
        run: pnpm test

      # Electron needs a display. xvfb is preinstalled on ubuntu-latest.
      - name: E2E
        run: xvfb-run -a pnpm test:e2e

      # Coverage thresholds gate on packages/geometry and packages/domain,
      # which arrive in slice 1.1. Enable this step then.
      # - name: Coverage
      #   run: pnpm test:coverage
