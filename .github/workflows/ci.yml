name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three independent jobs rather than one serial one, so a single run reports
# every failure instead of only the first. The setup preamble is repeated in
# each; a composite action to remove four duplicated lines would be more
# machinery than it saves.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Layering
        run: pnpm depcruise

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Turns a missing poppler from a silent skip into a failure. Without it,
      # a broken install step would quietly delete the strongest print checks
      # in the suite and the run would still be green. See
      # packages/export/src/pdf/writer.test.ts.
      LEATHERCAD_REQUIRE_POPPLER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # poppler renders the exported PDF so the tests can measure it in
      # pixels — the closest thing to checking the print with a steel rule.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: pnpm install --frozen-lockfile

      # Runs the suite and enforces the coverage thresholds from
      # vitest.config.ts in one pass, which is why there is no separate
      # coverage step.
      - name: Test with coverage
        run: pnpm test:coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEATHERCAD_REQUIRE_POPPLER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: pnpm install --frozen-lockfile

      # Electron needs a display. xvfb is preinstalled on ubuntu-latest.
      - name: E2E
        run: xvfb-run -a pnpm test:e2e

      # An Electron failure that will not reproduce locally is a dead end
      # without the trace and screenshots.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
