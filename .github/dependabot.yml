version: 2

updates:
  # The higher-value half: action majors drift silently otherwise, because
  # nothing else in the repository watches them.
  - package-ecosystem: github-actions
    directory: /
    # Updates are development work: they land on develop, and reach main with
    # the next release like everything else.
    target-branch: develop
    schedule:
      interval: weekly
    # A week's grace before proposing a release, so a compromised version is
    # likelier to be caught and pulled before it reaches CI. The same idea as
    # pnpm's minimumReleaseAge.
    cooldown:
      default-days: 7
    # Only minor and patch updates are grouped, and
    # .github/workflows/dependabot-auto-merge.yml merges that group once CI
    # passes. A major matches no group, so Dependabot opens it as a PR of its
    # own, outside the branch prefix the workflow trusts: it waits for a human.
    # (`update-types` here takes bare `minor` and `patch`; `ignore` below
    # spells the same thing `version-update:semver-major`.)
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(ci)

  # Dependabot proposes, and the checks decide for minor and patch updates —
  # see the github-actions entry above; a major is still the human's call. The
  # repository's own policies still apply on top — minimumReleaseAge in
  # pnpm-workspace.yaml, and an ADR for any genuinely new dependency (CLAUDE.md
  # § Conventions). These PRs go through the same CI jobs as any other.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    # Two constraints Dependabot cannot infer from package.json. Both were
    # learned from PR #3, which grouped a TypeScript 7 major together with a
    # routine bump and so held the whole group hostage to a change that
    # overrules an ADR.
    ignore:
      # ADR 0022 builds with TypeScript 7, installed as `@typescript/native`,
      # and keeps TypeScript 6 as `typescript`, for typescript-eslint. Both are
      # npm: aliases, and Dependabot does not document whether it matches an
      # alias by its own name or by the package it points at, so all three
      # names are listed. Patches are still welcome; a minor or a major is a
      # decision that belongs in an ADR, not in an automated PR.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@typescript/native'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@typescript/typescript6'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # @types/node describes the Node we actually run — engines says >=24.11
      # and CI uses 24, the Node inside Electron 45. A newer major describes
      # APIs that are not there, and the type errors it produces are real, not
      # spurious.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
