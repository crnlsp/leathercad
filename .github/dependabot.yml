version: 2

updates:
  # The higher-value half: action majors drift silently otherwise, because
  # nothing else in the repository watches them.
  - package-ecosystem: github-actions
    directory: /
    # Updates are development work: they land on develop, and reach main with
    # the next release like everything else.
    target-branch: develop
    schedule:
      interval: weekly
    # A week's grace before proposing a release, so a compromised version is
    # likelier to be caught and pulled before it reaches CI. The same idea as
    # pnpm's minimumReleaseAge.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)

  # Dependabot proposes; the human decides. The repository's own policies still
  # apply on top — minimumReleaseAge in pnpm-workspace.yaml, and an ADR for any
  # genuinely new dependency (CLAUDE.md § Conventions). These PRs go through
  # the same three CI jobs as any other.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
    # Two constraints Dependabot cannot infer from package.json. Both were
    # learned from PR #3, which grouped a TypeScript 7 major together with a
    # routine bump and so held the whole group hostage to a change that
    # overrules an ADR.
    ignore:
      # ADR 0022 builds with TypeScript 7, installed as `@typescript/native`,
      # and keeps TypeScript 6 as `typescript`, for typescript-eslint. Both are
      # npm: aliases, and Dependabot does not document whether it matches an
      # alias by its own name or by the package it points at, so all three
      # names are listed. Patches are still welcome; a minor or a major is a
      # decision that belongs in an ADR, not in an automated PR.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@typescript/native'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@typescript/typescript6'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # @types/node describes the Node we actually run — engines says >=22.12
      # and CI uses 22. A newer major describes APIs that are not there, and
      # the type errors it produces are real, not spurious.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
