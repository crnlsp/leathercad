packages:
  - 'packages/*'
  - 'apps/*'

# pnpm blocks dependency install scripts by default. Only packages that
# genuinely need one to function are allowed here, and each needs a reason.
# Treat additions to this list as a security decision, not a formality.
allowBuilds:
  # Installs the platform-native esbuild binary used by Vite.
  esbuild: true

  # Declined on purpose. Electron 44's package.json has no scripts field at
  # all — it ships an `install-electron` bin instead, which the postinstall in
  # apps/desktop/package.json invokes. pnpm still prompts about it, so this
  # records the answer. Setting it true would grant a permission that does
  # nothing.
  electron: false
  # Declined. Its only install script is IBM's `ibmtelemetry` postinstall,
  # which reports package usage over the network. We need the font files, not
  # the telemetry, and the files are vendored into assets/fonts/ anyway — the
  # dependency exists to pin where they came from. See ADR 0011.
  '@ibm/plex-sans': false
  # Declined. electron-builder depends on it for Windows Squirrel installers,
  # which this project does not build (Linux first; Windows is Phase 8). Its
  # install script only prepares Windows tooling. See ADR 0014.
  electron-winstaller: false

# pnpm gates very recent releases behind a minimum release age. These were
# reviewed and accepted; see ADR 0004.
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.0'
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0

# Versions forced past what a dependency pins, each for a known vulnerability
# that osv-scanner reports. Remove one when the dependency's own pin moves on.
overrides:
  # GHSA-4mjr-xmp4-gh2g, GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx. Pinned to
  # exactly 6.15.1 by typed-rest-client, which Stryker uses only to upload to
  # its dashboard, a reporter this project does not enable. 6.16.0 is the
  # fixed minor.
  'typed-rest-client>qs': 6.16.0

# Local fixes to third-party code, each temporary and each with its upstream
# issue. Delete the entry and its file in patches/ when the fix is released.
patchedDependencies:
  # stryker-js#6210: on Vitest 5 the runner's test-name filter matches nothing,
  # so every covered mutant is reported as surviving. Two lines. ADR 0016.
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
